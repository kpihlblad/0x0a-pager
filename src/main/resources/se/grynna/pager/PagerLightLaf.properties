#---- typography ----
# The UI font is IBM Plex Sans, bundled and registered by Fontalizer.installUiFonts().
# Font values: [bold] [italic] [<size> | +<incr> | -<decr>] [family, ...] - relative parts derive from defaultFont.
# Regular is the default for longer text (text fields, lists, tables, tooltips, messages).
# FlatLaf scales the absolute size with the desktop's font scaling (15 at 96 dpi).
defaultFont = 15 "IBM Plex Sans"

# FlatLaf's weight variable: used by the h1..h3 and semibold style classes and by the headers below.
semibold.font = "IBM Plex Sans SemiBold"

# Headers are SemiBold. A heading or field label opts in with
# putClientProperty(FlatClientProperties.STYLE_CLASS, "semibold"); everything else stays Regular.
TabbedPane.font = $semibold.font
TableHeader.font = $semibold.font
TitledBorder.font = $semibold.font

#---- colours ----
# Disabled text is lighter than the foreground on a light background.
*.disabledText  = lighten(@foreground,50%,derived)
*.disabledTextColor  = lighten(@foreground,50%,derived)
*.disabledForeground  = lighten(@foreground,50%,derived)
*.buttonDisabledArrowColor  = lighten(@foreground,50%,derived)
*.buttonDisabledSeparatorColor   = lighten(@foreground,50%,derived)
*.disabledTrackColor   = lighten(@foreground,50%,derived)
*.disabledThumbColor   = lighten(@foreground,50%,derived)
